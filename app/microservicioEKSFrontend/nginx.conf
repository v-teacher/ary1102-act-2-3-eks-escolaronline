map $request_method $product_backend {
    default get-products.escolaronline.svc.cluster.local:3001;
    POST create-product.escolaronline.svc.cluster.local:3002;
    PUT update-product.escolaronline.svc.cluster.local:3003;
    DELETE delete-product.escolaronline.svc.cluster.local:3004;
}
server {
    listen 80;
    server_name localhost;
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api/products {
        proxy_pass http://$product_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

